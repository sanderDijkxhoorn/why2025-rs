[package]
name = "why2025-rs"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "why2025-rs"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = ["std", "esp-idf-svc/native"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
# Periodic IMU and per-key logging; off by default to keep the display console readable.
telemetry = []

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", default-features = false }
esp-idf-hal = "0.47"
embedded-graphics = "0.8"
bmi2 = "0.1.2"

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = "src/bindings.h"
bindings_module = "display_sys"

[build-dependencies]
embuild = "0.33"
